appId: com.mobileagentbridge
---
# 验证：添加 serve → 验证 Settings 页面显示模型
- launchApp
- extendedWaitUntil:
    visible: "Connect"
    timeout: 15000
- tapOn:
    point: "540,1361"
- inputText: "D:\\code\\mobile-agent-bridge"
- tapOn: "Connect"
- extendedWaitUntil:
    visible: "Settings"
    timeout: 30000
- tapOn:
    text: "Settings"
- tapOn:
    text: ".+ Add"
- extendedWaitUntil:
    visible: "My Project"
    timeout: 10000
- tapOn:
    text: "My Project"
- eraseText: 100
- inputText: "Test E2E"
- tapOn:
    text: "D:.*my-project"
- eraseText: 100
- inputText: "D:\\code\\mobile-agent-bridge"
- tapOn: "Add Serve"
- extendedWaitUntil:
    visible: "Test E2E"
    timeout: 30000
- assertVisible: "Test E2E"
- extendedWaitUntil:
    visible: ".*running"
    timeout: 60000
- assertVisible:
    text: ".*running"
- tapOn:
    text: "Delete"
- tapOn:
    text: "DELETE"
- extendedWaitUntil:
    visible: "No serves configured"
    timeout: 10000
- assertNotVisible: "Test E2E"
