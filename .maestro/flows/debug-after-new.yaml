appId: com.mobileagentbridge
---
# Debug: 查看 "+ New" 后屏幕状态
- launchApp

- tapOn: "ws://192.168.1.100:8080/ws"
- eraseText: 50
- inputText: "ws://10.0.2.2:8081/ws"
- tapOn: "password (optional)"
- inputText: "test123"
- tapOn: "project directory (e.g. /home/user/project)"
- inputText: "."
- tapOn: "Connect"

- extendedWaitUntil:
    visible: "+ New"
    timeout: 20000

- tapOn: "+ New"

# 等待 5 秒确保导航完成
- extendedWaitUntil:
    visible: "Switch"
    timeout: 10000
