appId: com.mobileagentbridge
---
# Layer 4 — 工具执行链路（真实模型）
# 验证：消息触发工具调用 → 工具结果渲染 → 流式回复完成。
# 注：运行环境 permission 为 allow（自动批准），不弹审批 Sheet；此用例覆盖工具调用链路。
- launchApp

- runFlow: ../shared/connect-l4.yaml

# 创建会话
- tapOn: "+ New"
- extendedWaitUntil:
    visible: "< Sessions"
    timeout: 30000

# 发送会触发工具调用的消息（bash 列出当前目录文件，稳定触发工具）
- tapOn: "Type a message..."
- inputText: "use bash to list files in the current directory, then summarize what you see"
- tapOn: "Send message"

# 等待消息已发送
- extendedWaitUntil:
    visible: "use bash to list files in the current directory, then summarize what you see"
    timeout: 15000

# 等待流式回复完成（输入框恢复可交互）
- extendedWaitUntil:
    notVisible: "AI is thinking..."
    timeout: 120000

# 验证回复已渲染（输入框恢复，可再次输入）
- tapOn: "Type a message..."
- extendedWaitUntil:
    visible: "Type a message..."
    timeout: 10000

# 验证仍在 ChatScreen
- assertVisible: "Open commands"
