appId: com.mobileagentbridge
tags:
  - layer: l4
  - needs-opencode: true
---
# Layer 4 — 工具审批流程: 触发工具调用 → 验证审批 Sheet → 批准
- launchApp

- runFlow: .maestro/flows/shared/connect-l4.yaml

# 创建会话
- tapOn: "+ New"
- extendedWaitUntil:
    visible: "< Sessions"
    timeout: 30000

# 发送会触发工具调用的消息（读取文件）
- tapOn: "Type a message..."
- inputText: "read package.json"
- tapOn: "Send"

# 等待工具审批 Sheet 弹出
- extendedWaitUntil:
    visible: "Tool Request"
    timeout: 60000

# 验证工具名称可见
- assertVisible: "read"

# 批准工具执行
- tapOn: "Approve"

# 等待回复完成
- extendedWaitUntil:
    notVisible: "Tool Request"
    timeout: 60000
