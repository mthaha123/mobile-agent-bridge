appId: com.mobileagentbridge
---
# Layer 4 — 选择已有会话 + 历史消息渲染（全量加载）
# 流程：创建会话 → 发消息 → 验证用户消息渲染 → 回列表 → 重新选该会话 → 验证历史消息可见
- launchApp

# 连接真实 Bridge
- runFlow: ../shared/connect-l4.yaml

# 创建新会话并发送消息，产生历史消息
- tapOn: "+ New"
- extendedWaitUntil:
    visible: "< Sessions"
    timeout: 30000

- tapOn: "Type a message..."
- inputText: "Reply with the word: HELLO_HISTORY_123"
- tapOn: "Send message"

# 发送后用户消息应立即渲染（位于列表底部，此刻可见）
- extendedWaitUntil:
    visible: "Reply with the word: HELLO_HISTORY_123"
    timeout: 15000

# 等待回复完成
- extendedWaitUntil:
    notVisible: "AI is thinking..."
    timeout: 90000

# 回到会话列表
- tapOn: "< Sessions"
- extendedWaitUntil:
    visible: "+ New"
    timeout: 10000

# 选择刚创建的会话（首条消息已将该会话命名为 "Reply with the word: HELLO_..." 摘要，
# 用 HELLO_ 片段匹配，避开 "New session" 开头的残留/未命名会话）
- tapOn:
    text: "Reply with the word: HELLO_.*"

# 进入 ChatScreen
- extendedWaitUntil:
    visible: "< Sessions"
    timeout: 15000

# 验证历史消息被全量加载渲染（滚动到该消息可见）
- scrollUntilVisible:
    element:
      text: "Reply with the word: HELLO_HISTORY_123"
    direction: UP
    timeout: 30000

# 验证仍在 ChatScreen 且可交互
- assertVisible: "Open commands"
- tapOn: "Type a message..."
- extendedWaitUntil:
    visible: "Type a message..."
    timeout: 10000
