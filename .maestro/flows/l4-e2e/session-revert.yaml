appId: com.mobileagentbridge
---
# Layer 4 — 会话 Revert：长按 AI 回复 → 回退到此 → Reverted 确认
- launchApp

- runFlow: ../shared/connect-l4.yaml

# 创建会话
- tapOn: "+ New"
- extendedWaitUntil:
    visible: "< Sessions"
    timeout: 30000

# 发送消息（纯文本请求，避免触发工具调用导致消息结构复杂）
- tapOn: "Type a message..."
- inputText: "Reply with only the words: Hello, world!"
- tapOn: "Send message"

# 等待 AI 回复完成
- extendedWaitUntil:
    notVisible: "AI is thinking..."
    timeout: 90000

# 长按 AI 回复触发消息操作菜单
- longPressOn:
    id: "assistant-text-part"
- extendedWaitUntil:
    visible: "回退到此"
    timeout: 10000

# 点击回退到此
- tapOn: "回退到此"

# 确认回退成功
- extendedWaitUntil:
    visible: "Reverted"
    timeout: 15000

# 关闭确认弹窗
- tapOn: "OK"
