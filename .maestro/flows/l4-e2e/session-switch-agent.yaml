appId: com.mobileagentbridge
---
# Layer 4 — 切换 Agent + Model
- launchApp

- runFlow: ../shared/connect-l4.yaml

# 创建会话
- tapOn: "+ New"
- extendedWaitUntil:
    visible: "< Sessions"
    timeout: 30000

# 点击 ⌘ 打开 SlashSheet
- tapOn: "⌘"
- extendedWaitUntil:
    visible: "命令 & Agent"
    timeout: 10000

# 关闭 SlashSheet（点卡片外空白处，卡片占底部 ~70%，y=1500 在卡片上会点中空函数；点顶部区域）
- tapOn:
    point: "540,400"

# 点击 ⚙ 打开模型选择
- tapOn: "Model settings"
- extendedWaitUntil:
    visible: "Select Model"
    timeout: 5000

# 选择一个模型
- tapOn:
    point: "540,800"

# Model Picker 关闭
- extendedWaitUntil:
    notVisible: "Select Model"
    timeout: 5000
