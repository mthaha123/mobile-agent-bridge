appId: com.mobileagentbridge
tags:
  - layer: l4
  - needs-opencode: true
---
# Layer 4 — 切换 Agent + Model
- launchApp

- runFlow: .maestro/flows/shared/connect-l4.yaml

# 创建会话
- tapOn: "+ New"
- extendedWaitUntil:
    visible: "< Sessions"
    timeout: 30000

# 点击 ⌘ 打开 SlashSheet
- tapOn: "⌘"
- extendedWaitUntil:
    visible: "Commands"
    timeout: 5000

# 验证 Agent 列表存在
- assertVisible: "Switch agent"

# 关闭 SlashSheet
- tapOn:
    point: "540,1500"

# 点击 ⚙ 打开模型选择
- tapOn: "Model settings"
- extendedWaitUntil:
    visible: "Select Model"
    timeout: 5000

# 选择一个模型
- tapOn:
    point: "540,800"

# Model Picker 关闭
- extendedWaitUntil:
    notVisible: "Select Model"
    timeout: 5000
