appId: com.mobileagentbridge
---
# P0 横向滚动验证（Mock Bridge 打桩 @ 8081）
# 前置：node scripts/e2e/mock-bridge.mjs 已启动（WS 8081 / push 18081，测试端口）
# 思路：连 Mock → 新建会话 → 发 "__widetable__" 注入超宽 Markdown 表格 →
#       断言横滑前右侧锚点不可见 → 横滑后可见（证明嵌套横向滚动生效）
#
# 起点自适应：
#   若停在主界面（Settings 可见）→ Settings → Disconnect（持久化 autoConnect=false）
#   若已在连接页 → 跳过，直接改写 URL
- launchApp

# autoConnect 默认连生产 8080：成功则进入 Sessions（+ New 出现）。
# 等它稳定后再 Disconnect，避免在连接页被 500ms 自动连接抢占。
- extendedWaitUntil:
    visible: "+ New"
    timeout: 15000
    optional: true

# 若已进入主界面 → Settings → Disconnect（持久化 autoConnect=false）
- runFlow:
    when:
      visible: "Settings"
    commands:
      - tapOn: "Settings"
      - scrollUntilVisible:
          element:
            text: "Disconnect"
          direction: DOWN
          timeout: 15000
      - tapOn: "Disconnect"

# 连接页就绪
- extendedWaitUntil:
    visible: "Mobile Agent Bridge"
    timeout: 20000

# ── 连接 Mock Bridge（测试端口 8081）──
- tapOn:
    text: "ws://.*"
    index: 0
- eraseText: 60
- inputText: "ws://10.0.2.2:8081/ws"
# 密码框可能已有默认值（placeholder 不显示）→ 仅在可见时补填
- runFlow:
    when:
      visible: "password (optional)"
    commands:
      - tapOn:
          text: "password (optional)"
          index: 0
      - eraseText: 30
      - inputText: "test123"
- tapOn: "Connect"

# 连上后进入主界面
- extendedWaitUntil:
    visible: "+ New"
    timeout: 20000

# ── 新建会话进入 ChatScreen ──
- tapOn: "+ New"
- extendedWaitUntil:
    visible: "Open commands"
    timeout: 15000

# ── 注入超宽表格（mock-bridge 内建 magic message）──
- tapOn: "Type a message..."
- eraseText: 50
- inputText: "__widetable__"
- tapOn: "Send message"

# 表格渲染：左侧列可见
- extendedWaitUntil:
    visible: "Module"
    timeout: 10000

# 把表格滚到视口中间，确保横向 swipe 落在表格区域内
- scrollUntilVisible:
    element:
      text: "Shared-Primitive"
    direction: DOWN
    timeout: 10000

# 横向滚动前，最右列锚点应不可见（被裁剪在视口外）
- assertNotVisible: "RIGHTMOST-ANCHOR-visible-only-after-horizontal-scroll"

# 在表格区域从右向左扫，露出右侧列
# y 取表格垂直中心（表格 bounds ≈ [1051,1624]，中心 ≈1337px ≈ 56%），
# 避免贴底被外层列表抢走手势
- swipe:
    start: "88%, 56%"
    end: "10%, 56%"
- extendedWaitUntil:
    visible: "RIGHTMOST-ANCHOR-visible-only-after-horizontal-scroll"
    timeout: 5000

# 全屏兜底入口仍可用（回归）
- tapOn: "全屏查看表格"
- extendedWaitUntil:
    visible: "表格视图"
    timeout: 5000
- tapOn: "关闭表格视图"
