appId: com.mobileagentbridge
---
# Layer 3 - Tool Progress: magic message -> tool part renders in chat, status updates
# ToolProgressCard was removed; tool progress is now rendered in MessageItem via PartBlock/BasicTool
- launchApp:
    stopApp: true

- tapOn: "ws://192.168.1.100:8080/ws"
- eraseText: 50
- inputText: "ws://10.0.2.2:8081/ws"
- tapOn: "password (optional)"
- inputText: "test123"
- tapOn: "project directory (e.g. /home/user/project)"
- inputText: "."
- tapOn: "Connect"

- extendedWaitUntil:
    visible: "+ New"
    timeout: 20000

- tapOn: "+ New"
- extendedWaitUntil:
    visible: "Open commands"
    timeout: 15000

# 1. tool.called -> tool part appears in chat (BasicTool renders tool title)
- tapOn: "Type a message..."
- eraseText: 50
- inputText: '__push__:session.next.tool.called:{"callID":"call-1","sessionID":"mock_s1","tool":"writeFile","input":{"path":"test.ts","content":"hello"}}'
- pressKey: Enter

# After tool.called, ingestEvent creates tool part -> PartBlock -> BasicTool renders tool name
# BasicTool shows tool title from getToolInfo (e.g. "Write" for writeFile)
- extendedWaitUntil:
    visible: "writeFile"
    timeout: 10000

# 2. tool.progress -> tool part still visible
- tapOn: "Type a message..."
- eraseText: 50
- inputText: '__push__:session.next.tool.progress:{"callID":"call-1","content":["Writing file..."]}'
- pressKey: Enter

- assertVisible: "writeFile"

# 3. tool.success -> tool part stays in chat history with completed status
- tapOn: "Type a message..."
- eraseText: 50
- inputText: '__push__:session.next.tool.success:{"callID":"call-1","content":"File written","result":{"ok":true}}'
- pressKey: Enter

# Tool part remains in chat history (was ToolProgressCard that disappeared; now it persists as a PartBlock)
- assertVisible: "writeFile"
