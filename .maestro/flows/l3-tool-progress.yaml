appId: com.mobileagentbridge
---
# Layer 3 - ToolProgressCard: magic message -> running card appears/disappears
- launchApp:
    stopApp: true

- tapOn: "ws://192.168.1.100:8080/ws"
- eraseText: 50
- inputText: "ws://10.0.2.2:8081/ws"
- tapOn: "password (optional)"
- inputText: "test123"
- tapOn: "project directory (e.g. /home/user/project)"
- inputText: "."
- tapOn: "Connect"

- extendedWaitUntil:
    visible: "+ New"
    timeout: 20000

- tapOn: "+ New"
- extendedWaitUntil:
    visible: "Open commands"
    timeout: 15000

# 1. tool.called -> running card appears
- tapOn: "Type a message..."
- eraseText: 50
- inputText: '__push__:session.next.tool.called:{"callID":"call-1","sessionID":"mock_s1","tool":"writeFile","input":{"path":"test.ts","content":"hello"}}'
- pressKey: Enter

- extendedWaitUntil:
    visible: "tool-progress-card"
    timeout: 10000

# 2. tool.progress -> card stays
- tapOn: "Type a message..."
- eraseText: 50
- inputText: '__push__:session.next.tool.progress:{"callID":"call-1","content":["Writing file..."]}'
- pressKey: Enter

- assertVisible: "tool-progress-card"

# 3. tool.success -> card disappears (chat tool part stays in history)
- tapOn: "Type a message..."
- eraseText: 50
- inputText: '__push__:session.next.tool.success:{"callID":"call-1","content":"File written","result":{"ok":true}}'
- pressKey: Enter

- extendedWaitUntil:
    notVisible: "tool-progress-card"
    timeout: 10000
