appId: com.mobileagentbridge
---
# Layer 5 — Complete E2E: 连接 → 创建 Session → 发送消息 → 观测完整 UI
#
# 观测内容：
#   1. 连接流程 (URL/Password/Directory → Connect → Tab 栏)
#   2. Session 创建 (+ New → 输入框)
#   3. 消息发送 (输入文字 → ➤ 按钮)
#   4. AI 思考过程 (⚡ Thinking...)
#   5. 工具执行 (Shell/Glob/Task 等 ToolProgressCard)
#   6. 流式文本回复 (Markdown 渲染)
#   7. Assistant 消息的 Copy/Revert 按钮
#
# 前置条件：
#   - 模拟器已运行、APK 已安装
#   - Bridge 服务器已启动（见 run-bridge.ps1）
#   - OpenCode 服务器已启动（见 run-oc.ps1）
#   - opencode.json 已配置 permission: allow（自动批准工具）

- launchApp

# ============================================================
# Step 1: 连接 Bridge 服务�?
# ============================================================
- tapOn: "ws://192.168.1.100:8080/ws"
- eraseText: 50
- inputText: "ws://10.0.2.2:19985/ws"
- tapOn: "password (optional)"
- inputText: "test123"
- tapOn: "project directory (e.g. /home/user/project)"
- inputText: 'D:\code\mobile-agent-bridge'
- tapOn: "Connect"

# 校验点 1: 连接成功 → 会话列表出现（+ New 是连接成功的可靠信号）
- extendedWaitUntil:
    visible: "+ New"
    timeout: 30000
- assertNotVisible: "Connect"
- assertVisible: "Files"
- assertVisible: "Settings"

# ============================================================
# Step 2: 创建 Session
# ============================================================
- tapOn: "+ New"
- extendedWaitUntil:
    visible: "Open commands"
    timeout: 15000

# 进入 ChatScreen（Open commands 按钮始终存在）
- assertVisible: "Open commands"

# ============================================================
# Step 3: 发送消息 — "what files are in the current project?"
# ============================================================
# 点击输入框（通过 accessibilityLabel）
- tapOn: "Type a message..."
- inputText: "what files are in the current project directory?"
# 点击发送按钮（通过 accessibilityLabel）
- tapOn: "Send message"

# ============================================================
# Step 4: 验证消息已发送（消息文本出现在聊天列表中）
# ============================================================
- extendedWaitUntil:
    visible: "what files are in the current project directory?"
    timeout: 15000

# ============================================================
# Step 5: 验证输入栏
# ============================================================
- assertVisible: "Open commands"
