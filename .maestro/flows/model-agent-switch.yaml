appId: com.mobileagentbridge
---
- launchApp
- tapOn: "ws://192.168.1.100:8080/ws"
- eraseText: 50
- inputText: "ws://10.0.2.2:8080/ws"
- tapOn: "password (optional)"
- inputText: "test123"
- tapOn: "project directory (e.g. /home/user/project)"
- inputText: "."
- tapOn: "Connect"
- extendedWaitUntil:
    visible: "+ New"
    timeout: 20000
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "Disconnect"
    timeout: 10000
- assertVisible: "Connected"
