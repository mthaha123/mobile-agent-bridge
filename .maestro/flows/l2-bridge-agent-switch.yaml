appId: com.mobileagentbridge
---
# Layer 2 — SlashSheet → Agent 切换
- launchApp

- tapOn: "ws://192.168.1.100:8080/ws"
- eraseText: 50
- inputText: "ws://10.0.2.2:8081/ws"
- tapOn: "password (optional)"
- inputText: "test123"
- tapOn: "project directory (e.g. /home/user/project)"
- inputText: "."
- tapOn: "Connect"

- extendedWaitUntil:
    visible: "+ New"
    timeout: 20000

- tapOn: "+ New"
- extendedWaitUntil:
    visible: "< Sessions"
    timeout: 15000

# 打开 SlashSheet
- tapOn: "Open commands"
- extendedWaitUntil:
    visible: "Commands & Agents"
    timeout: 5000

# 验证 Agents 区域
- assertVisible: "Switch agent"
- assertVisible: "Build Agent"

# 点击 Agent 切换（自动关闭 Sheet）
- tapOn: "Build Agent"

# SlashSheet 关闭，回到 ChatScreen
- assertVisible: "Model settings"

# 返回会话列表
- tapOn: "Back to sessions"
- assertVisible: "+ New"
