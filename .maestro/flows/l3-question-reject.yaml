appId: com.mobileagentbridge
---
# Layer 3 — QuestionDock Reject 分支:
# 发送 magic message → 提问面板弹出 → 点击 Reject → 面板关闭
- launchApp

- tapOn: "ws://192.168.1.100:8080/ws"
- eraseText: 50
- inputText: "ws://10.0.2.2:8081/ws"
- tapOn: "password (optional)"
- inputText: "test123"
- tapOn: "project directory (e.g. /home/user/project)"
- inputText: "."
- tapOn: "Connect"

- extendedWaitUntil:
    visible: "+ New"
    timeout: 20000

- tapOn: "+ New"
- extendedWaitUntil:
    visible: "Open commands"
    timeout: 15000

- assertVisible: "Open commands"

# 发送 magic message 触发 question.v2.asked 通知
- tapOn: "Type a message..."
- eraseText: 50
- inputText: "t"
- eraseText: 50
- inputText: '__push__:question.v2.asked:{"id":"q-reject-1","sessionID":"mock_s1","questions":[{"question":"Apply this patch?","header":"","options":[{"label":"Yes","description":""},{"label":"No","description":""}]}]}'
- pressKey: Enter

# 校验: QuestionDock 弹出
- extendedWaitUntil:
    visible: "Apply this patch?"
    timeout: 10000
- assertVisible: "Submit"
- assertVisible: "Reject"

# 点击 Reject → Dock 关闭（Submit 消失）
- tapOn: "Reject"

- extendedWaitUntil:
    notVisible: "Submit"
    timeout: 10000

# 验证仍在 ChatScreen
- assertVisible: "Open commands"
