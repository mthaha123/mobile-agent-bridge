appId: com.mobileagentbridge
---
# Layer 2 — SlashSheet 命令/Agent 列表
- launchApp

- tapOn: "ws://192.168.1.100:8080/ws"
- eraseText: 50
- inputText: "ws://10.0.2.2:8081/ws"
- tapOn: "password (optional)"
- inputText: "test123"
- tapOn: "project directory (e.g. /home/user/project)"
- inputText: "."
- tapOn: "Connect"

- extendedWaitUntil:
    visible: "+ New"
    timeout: 20000

- tapOn: "+ New"
- extendedWaitUntil:
    visible: "< Sessions"
    timeout: 15000

# 打开 SlashSheet
- tapOn: "Open commands"
- extendedWaitUntil:
    visible: "Commands & Agents"
    timeout: 5000

# 验证 Commands 区域
- assertVisible: "Commands"
- assertVisible: "help"
- assertVisible: "search"
- assertVisible: "model"
- assertVisible: "agent"

# 验证 Agents 区域
- assertVisible: "Agents"
- assertVisible: "Switch agent"
- assertVisible: "Build Agent"

# 点击一个命令验证 onSelect 关闭 Sheet
- tapOn: "help"
- extendedWaitUntil:
    notVisible: "Commands & Agents"
    timeout: 3000

# 回到会话列表
- tapOn: "Back to sessions"
- assertVisible: "+ New"
