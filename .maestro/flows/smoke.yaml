appId: com.mobileagentbridge
---
# ─── 启动 + ConnectScreen ──────────────────────
- launchApp
- extendedWaitUntil:
    visible: "Mobile Agent Bridge"
    timeout: 15000
- assertVisible: "Connect"

# 输入连接信息
- tapOn:
    point: "540,1131"
- eraseText
- inputText: "ws://10.0.2.2:19985/ws"
- pressKey: Enter

- tapOn:
    point: "540,1280"
- inputText: "test123"
- pressKey: Enter

- tapOn:
    point: "540,1428"
- eraseText
- inputText: "D:/code/mobile-agent-bridge"

- tapOn: "Connect"

# ─── 等待主界面 ────────────────────────────────
- extendedWaitUntil:
    visible: "+ New"
    timeout: 20000

# ─── 导航 + 按钮 + 创建会话 ─────────────────────
- tapOn: "Files"
- assertVisible: "Search"
- tapOn: "Settings"
- assertVisible: "Disconnect"
- tapOn: "Chat"
- assertVisible: "+ New"

- tapOn: "Switch"
- assertVisible: "Cancel"
- assertVisible: "Switch Project"
- tapOn: "Cancel"
- assertVisible: "+ New"

- tapOn: "+ New"
- extendedWaitUntil:
    visible: "< Sessions"
    timeout: 15000
- tapOn: "< Sessions"
- assertVisible: "+ New"

# ─── 断开连接 → ConnectScreen ──────────────────
- tapOn: "Settings"
- assertVisible: "Disconnect"
- tapOn: "Disconnect"
- extendedWaitUntil:
    visible: "Mobile Agent Bridge"
    timeout: 10000
- assertVisible: "Connect"
