appId: com.mobileagentbridge
---
# 手动单次运行 — HTML 弹窗预览验收（自包含：含连接 Mock Bridge 步骤）
#
# 用法（需先 adb shell pm clear com.mobileagentbridge）：
#   .maestro\maestro.cmd test .maestro\flows\html-viewer-modal-mock.yaml
#
# 依赖：mock-bridge.mjs 的 test-sample.html 夹具（file.list + file.read.html）。
# 注意：不加 "l2-" 前缀，避免被 run-layer.mjs 的 l2 批次扫到（该批次假定已连接）。
- launchApp
- runFlow: shared/connect.yaml

# 进入 Files 标签
- tapOn: "Files"
- extendedWaitUntil:
    visible: "Search files..."
    timeout: 15000

# 找到并打开 test-sample.html → 弹窗预览
- scrollUntilVisible:
    element: "test-sample.html"
    direction: DOWN
    timeout: 15000
- tapOn: "test-sample.html"

# WebView 渲染 HTML
- extendedWaitUntil:
    visible: "HTML File Viewer Test"
    timeout: 15000
- assertVisible: "CSS styling"

# 弹窗顶栏控件（文件名 + 源码 + 外部打开 + 关闭）
- assertVisible: "test-sample.html"
- assertVisible: "源码"
- assertVisible: ".*外部打开.*"
- assertVisible: "✕"

# 外部打开：点击应发出 ACTION_VIEW(text/html)（交给浏览器/选择器）
- tapOn: ".*外部打开.*"
- pressKey: Back
- extendedWaitUntil:
    visible: "HTML File Viewer Test"
    timeout: 10000

# 源码 / 渲染 切换
- tapOn: "源码"
- extendedWaitUntil:
    visible: "渲染"
    timeout: 10000
- tapOn: "渲染"
- extendedWaitUntil:
    visible: "HTML File Viewer Test"
    timeout: 10000

# 关闭弹窗 → 回到文件浏览器（未整页跳转）
- tapOn: "✕"
- extendedWaitUntil:
    visible: "Search files..."
    timeout: 5000
