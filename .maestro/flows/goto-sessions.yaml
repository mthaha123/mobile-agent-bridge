appId: com.mobileagentbridge
---
# 连接并进入会话列表
- launchApp
- tapOn: "ws://.*"
- eraseText: 60
- inputText: "ws://10.0.2.2:8080/ws"
- tapOn: "password (optional)"
- inputText: "test123"
- tapOn: "project directory (e.g. /home/user/project)"
- inputText: "."
- tapOn: "Connect"
- extendedWaitUntil:
    visible: "+ New"
    timeout: 30000

# 滚动会话列表找到目标历史会话并打开
- scrollUntilVisible:
    element:
      text: "Implement Task 10.*"
    direction: DOWN
    timeout: 30000
- tapOn:
    text: "Implement Task 10.*"
- extendedWaitUntil:
    visible: "< Sessions"
    timeout: 20000
