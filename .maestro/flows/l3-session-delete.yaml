appId: com.mobileagentbridge
---
# Layer 3 — 会话删除: 长按会话 → Alert 确认 → Delete → 会话从列表移除
- launchApp

- tapOn: "ws://192.168.1.100:8080/ws"
- eraseText: 50
- inputText: "ws://10.0.2.2:8081/ws"
- tapOn: "password (optional)"
- inputText: "test123"
- tapOn: "project directory (e.g. /home/user/project)"
- inputText: "."
- tapOn: "Connect"

- extendedWaitUntil:
    visible: "Session 1"
    timeout: 20000

# 长按会话卡片触发删除确认 Alert
- longPressOn: "Session 1"

# 校验删除确认弹窗
- extendedWaitUntil:
    visible: "Delete Session"
    timeout: 10000
- assertVisible: "Cancel"
- assertVisible: "Delete"

# 点击 Delete 确认删除
- tapOn: "Delete"

# 删除后 Alert 关闭
- extendedWaitUntil:
    notVisible: "Delete Session"
    timeout: 10000

# 会话列表仍在（其他会话仍可见）
- assertVisible: "Session 2"
