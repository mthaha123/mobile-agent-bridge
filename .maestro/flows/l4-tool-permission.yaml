appId: com.mobileagentbridge
---
# Layer 4 — Tool Permission: 连接 → 创建 Session → 发工具消息 → 验证结果
- launchApp

# Step 1: 连接
- tapOn: "ws://192.168.1.100:8080/ws"
- eraseText: 50
- inputText: "ws://10.0.2.2:8081/ws"
- tapOn: "password (optional)"
- inputText: "test123"
- tapOn: "project directory (e.g. /home/user/project)"
- inputText: "."
- tapOn: "Connect"

# 校验点 1: 连接成功
- extendedWaitUntil:
    visible: "Chat"
    timeout: 20000

# Step 2: 创建 Session
- tapOn: "+ New"
- extendedWaitUntil:
    visible: "Type a message..."
    timeout: 15000

# Step 3: 发消息（触发工具调用：列出文件）
- tapOn: "Type a message..."
- inputText: "list files in the current directory"
- tapOn: "➤"

# 校验点 2: AI 回复出现（assistant message 有 accessibilityLabel）
- extendedWaitUntil:
    visible:
      label: "package"
    timeout: 60000
