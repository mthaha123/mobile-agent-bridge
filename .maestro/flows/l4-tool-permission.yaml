appId: com.mobileagentbridge
---
# Layer 4 — Tool Permission: 连接 → 创建 Session → 发工具消息 → 验证结果
- launchApp

# Step 1: 连接
- tapOn: "ws://192.168.1.100:8080/ws"
- eraseText: 50
- inputText: "ws://10.0.2.2:8081/ws"
- tapOn: "password (optional)"
- inputText: "test123"
- tapOn: "project directory (e.g. /home/user/project)"
- inputText: "."
- tapOn: "Connect"

# 校验点 1: 连接成功
- extendedWaitUntil:
    visible: "Chat"
    timeout: 30000

# Step 2: 创建 Session
- tapOn: "+ New"
- extendedWaitUntil:
    visible: "Open commands"
    timeout: 15000

# Step 3: 发消息（触发工具调用：列出文件）
- tapOn:
    point: "50%,87%"
    waitToSettleTimeoutMs: 500
- inputText: "list files in the current directory"
- hideKeyboard
- tapOn:
    point: "95%,87%"
    waitToSettleTimeoutMs: 500

# 校验点 2: 验证消息已发送（Copy 按钮表示消息已添加到列表）
- extendedWaitUntil:
    visible: "Copy"
    timeout: 30000
