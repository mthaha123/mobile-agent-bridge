appId: com.mobileagentbridge
---
# Layer 4 — Tool Permission: 连接 → 创建 Session → 发工具消息 → 审批工具 → 验证完成
- launchApp

# Step 1: 连接
- tapOn: "ws://192.168.1.100:8080/ws"
- eraseText: 50
- inputText: "ws://10.0.2.2:8081/ws"
- tapOn: "password (optional)"
- inputText: "test123"
- tapOn: "project directory (e.g. /home/user/project)"
- inputText: "."
- tapOn: "Connect"

# 校验点 1: 连接成功
- extendedWaitUntil:
    visible: "Chat"
    timeout: 20000

# Step 2: 创建 Session
- tapOn: "+ New"
- extendedWaitUntil:
    visible: "Type a message..."
    timeout: 15000

# Step 3: 发消息
- tapOn: "Type a message..."
- inputText: "hello"
- tapOn: "➤"

# 校验点 2: AI 回复出现
- extendedWaitUntil:
    visible: ".*Hello.*|.*hello.*|.*Hi.*|.*hi.*"
    timeout: 60000
