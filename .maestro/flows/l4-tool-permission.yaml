appId: com.mobileagentbridge
---
# Layer 4 — Tool Execution: 连接 → 创建 Session → 发消息 → 验证回复
#
# 注意: OpenCode "steer" delivery 模式下工具自动审批（无 "Tool Request" 弹窗），
# 且 Markdown 表格渲染的文件名字段不在 accessibility tree 中导致无法用 textRegex 匹配。
# 本流程仅验证消息发送与回复到达，工具执行细节由协议层 E2E（flow1-core-chat.mjs）覆盖。
- launchApp

# Step 1: 连接
- tapOn: "ws://192.168.1.100:8080/ws"
- eraseText: 50
- inputText: "ws://10.0.2.2:8081/ws"
- tapOn: "password (optional)"
- inputText: "test123"
- tapOn: "project directory (e.g. /home/user/project)"
- inputText: "."
- tapOn: "Connect"

# 校验点 1: 连接成功
- extendedWaitUntil:
    visible: "Chat"
    timeout: 20000

# Step 2: 创建 Session
- tapOn: "+ New"
- extendedWaitUntil:
    visible: "Type a message..."
    timeout: 15000

# Step 3: 发消息
- tapOn: "Type a message..."
- inputText: "hello"
- tapOn: "➤"

# 校验点 2: AI 回复出现（纯文本回复，accessibility tree 可捕获）
- extendedWaitUntil:
    visible: ".*Hello.*|.*hello.*|.*Hi.*|.*hi.*"
    timeout: 180000
