appId: com.mobileagentbridge
---
# Layer 2 — 连接 Mock Bridge
- launchApp

# 输入 WebSocket URL
- tapOn: "ws://192.168.1.100:8080/ws"
- eraseText: 50
- inputText: "ws://10.0.2.2:8081/ws"

# 输入密码
- tapOn: "password (optional)"
- inputText: "test123"

# 输入项目目录
- tapOn: "project directory (e.g. /home/user/project)"
- inputText: "."

# 点击连接
- tapOn: "Connect"

# 等待会话列表加载
- extendedWaitUntil:
    visible: "+ New"
    timeout: 20000

# 验证连接成功 → Settings 显示 Connected
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "Connected"
    timeout: 10000
- assertVisible: "Bridge URL"
- swipe:
    direction: UP
    duration: 500
- extendedWaitUntil:
    visible: "Disconnect"
    timeout: 10000
