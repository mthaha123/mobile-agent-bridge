appId: com.mobileagentbridge
---
# Layer 3 — Core Chat: 连接 → 创建 Session → 发消息 → 流式文本回复
- launchApp

# Step 1: 连接
- tapOn: "ws://192.168.1.100:8080/ws"
- eraseText: 50
- inputText: "ws://10.0.2.2:8081/ws"
- tapOn: "password (optional)"
- inputText: "test123"
- tapOn: "project directory (e.g. /home/user/project)"
- inputText: "."
- tapOn: "Connect"

# 校验点 1: 连接成功，Tab 栏出现
- extendedWaitUntil:
    visible: "Chat"
    timeout: 20000
- assertNotVisible: "Connect"
- assertVisible: "Files"
- assertVisible: "Settings"

# Step 2: 创建 Session
- tapOn: "+ New"
- extendedWaitUntil:
    visible: "Type a message..."
    timeout: 15000

# 校验点 2: 进入 ChatScreen
- assertVisible: "Type a message..."

# Step 3: 发消息
- tapOn: "Type a message..."
- inputText: "hello"
- tapOn: "➤"

# 校验点 3: AI 正在思考
- extendedWaitUntil:
    visible: "AI is thinking..."
    timeout: 10000

# 校验点 4: AI 回复出现
- extendedWaitUntil:
    visible: ".*Hello.*|.*hello.*|.*Hi.*|.*hi.*"
    timeout: 60000
