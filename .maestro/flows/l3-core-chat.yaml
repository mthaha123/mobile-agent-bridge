appId: com.mobileagentbridge
---
# Layer 3 — Core Chat: 连接 → 创建 Session → 发消息 → 流式文本回复
- launchApp

# Step 1: 连接
- tapOn: "ws://192.168.1.100:8080/ws"
- eraseText: 50
- inputText: "ws://10.0.2.2:8081/ws"
- tapOn: "password (optional)"
- inputText: "test123"
- tapOn: "project directory (e.g. /home/user/project)"
- inputText: "."
- tapOn: "Connect"

# 校验点 1: 连接成功，Tab 栏出现
- extendedWaitUntil:
    visible: "Chat"
    timeout: 30000
- assertNotVisible: "Connect"
- assertVisible: "Files"
- assertVisible: "Settings"

# Step 2: 创建 Session
- tapOn: "+ New"
- extendedWaitUntil:
    visible: "Open commands"
    timeout: 15000

# 校验点 2: 进入 ChatScreen（用 Open commands 定位，placeholder 不可无障碍访问）
- assertVisible: "Open commands"

# Step 3: 发消息
- tapOn:
    point: "50%,87%"
    waitToSettleTimeoutMs: 500
- inputText: "hello"
- hideKeyboard
- tapOn:
    point: "95%,87%"
    waitToSettleTimeoutMs: 500

# 校验点 3: 验证消息已发送（Copy 按钮表示消息已添加到列表）
- extendedWaitUntil:
    visible: "Copy"
    timeout: 30000
