appId: com.mobileagentbridge
---
# Layer 2 — HTML 文件查看器: WebView 渲染 + 源码切换
- launchApp

# 等待主界面
- extendedWaitUntil:
    visible: "Files"
    timeout: 25000

# 进入 Files 标签
- tapOn: "Files"
- extendedWaitUntil:
    visible: "Search files..."
    timeout: 15000

# 滚动找到 test-sample.html（目录在前，文件在后）
- scrollUntilVisible:
    element: "test-sample.html"
    direction: DOWN
    timeout: 15000

# 打开 test-sample.html
- tapOn: "test-sample.html"
- extendedWaitUntil:
    visible: "HTML File Viewer Test"
    timeout: 15000

# 校验点 1: HTML 内容通过 WebView 渲染（CSS 样式生效）
- assertVisible: "HTML File Viewer Test"
- assertVisible: "CSS styling"

# 校验点 2: 顶栏显示文件名 + 源码切换按钮
- assertVisible: "test-sample.html"
- assertVisible: "源码"

# 校验点 3: 切换到源码模式
- tapOn: "源码"
- extendedWaitUntil:
    visible: "渲染"
    timeout: 10000

# 校验点 4: 源码模式 — header 显示"渲染"按钮，底部显示行号控制
- assertVisible: "渲染"
- assertVisible: "行号开"
- assertVisible: "复制"

# 校验点 5: 切回渲染模式
- tapOn: "渲染"
- extendedWaitUntil:
    visible: "HTML File Viewer Test"
    timeout: 10000

# 校验点 6: 渲染模式恢复
- assertVisible: "HTML File Viewer Test"

# 返回文件列表
- tapOn: "←"
- extendedWaitUntil:
    visible: "Search files..."
    timeout: 5000
