appId: com.mobileagentbridge
---
# Layer 2 — HTML 文件弹窗预览: WebView 渲染 + 源码切换 + 外部打开入口
#
# 前置：测试桥（19985 / Mock）已就绪，项目目录含 test-sample.html 夹具。
# 说明：v1 的 HTML 全屏查看器已退役，HTML 改为 Modal 弹窗预览（HtmlPreviewModal）。
#       因此不再断言全屏查看器专有的「行号开 / 复制 / ←」，改为弹窗顶栏控件。
- launchApp

# 等待主界面
- extendedWaitUntil:
    visible: "Files"
    timeout: 25000

# 进入 Files 标签
- tapOn: "Files"
- extendedWaitUntil:
    visible: "Search files..."
    timeout: 15000

# 滚动找到 test-sample.html（目录在前，文件在后）
- scrollUntilVisible:
    element: "test-sample.html"
    direction: DOWN
    timeout: 15000

# 打开 test-sample.html → 弹窗预览（不再整页跳转）
- tapOn: "test-sample.html"
- extendedWaitUntil:
    visible: "HTML File Viewer Test"
    timeout: 15000

# 校验点 1: HTML 内容通过 WebView 渲染（CSS 样式生效）
- assertVisible: "HTML File Viewer Test"
- assertVisible: "CSS styling"

# 校验点 2: 弹窗顶栏显示文件名 + 源码切换 + 外部打开 + 关闭（弹窗控件集）
- assertVisible: "test-sample.html"
- assertVisible: "源码"
- assertVisible: ".*外部打开.*"
- assertVisible: "✕"

# 校验点 3: 切换到源码模式
- tapOn: "源码"
- extendedWaitUntil:
    visible: "渲染"
    timeout: 10000
- assertVisible: "渲染"

# 校验点 4: 切回渲染模式
- tapOn: "渲染"
- extendedWaitUntil:
    visible: "HTML File Viewer Test"
    timeout: 10000

# 校验点 5: 关闭弹窗，回到文件浏览器（仍在 Files 标签，未整页跳转）
- tapOn: "✕"
- extendedWaitUntil:
    visible: "Search files..."
    timeout: 5000
