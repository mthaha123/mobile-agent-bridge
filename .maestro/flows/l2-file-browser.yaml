appId: com.mobileagentbridge
---
# Layer 2 — File Browser: 连接 → 文件列表 → 搜索 → 阅读文件 → 关闭预览
- launchApp

# 连接
- tapOn: "ws://192.168.1.100:8080/ws"
- eraseText: 50
- inputText: "ws://10.0.2.2:8081/ws"
- tapOn: "password (optional)"
- inputText: "test123"
- tapOn: "project directory (e.g. /home/user/project)"
- inputText: "."
- tapOn: "Connect"

# 等连接完成
- extendedWaitUntil:
    visible: "+ New"
    timeout: 20000

# 进入 Files 标签
- tapOn: "Files"
- extendedWaitUntil:
    visible: "Search files..."
    timeout: 15000

# 校验点 1: 搜索栏可见
- assertVisible: "Search files..."

# Step 1: 搜索文件 (搜索 Bridge 目录下的 package.json)
- tapOn: "Search files..."
- inputText: "package"
- tapOn: "Search"
- extendedWaitUntil:
    visible: ".*package\\.json.*"
    timeout: 15000

# 校验点 2: 搜索结果含 package.json
- assertVisible: ".*package\\.json.*"
