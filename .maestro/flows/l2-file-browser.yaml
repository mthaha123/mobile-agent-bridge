appId: com.mobileagentbridge
---
# Layer 2 — File Browser: 连接 → Files 标签 → 文件列表 → 阅读文件 → 关闭预览
- launchApp

# 连接
- tapOn: "ws://192.168.1.100:8080/ws"
- eraseText: 50
- inputText: "ws://10.0.2.2:8081/ws"
- tapOn: "password (optional)"
- inputText: "test123"
- tapOn: "project directory (e.g. /home/user/project)"
- inputText: "."
- tapOn: "Connect"

# 等连接完成
- extendedWaitUntil:
    visible: "+ New"
    timeout: 20000

# 进入 Files 标签
- tapOn: "Files"
- extendedWaitUntil:
    visible: "Search files..."
    timeout: 15000

# 校验点 1: 搜索栏和文件列表可见
- assertVisible: "Search files..."

# 点开 package.json 文件
- tapOn: "package.json"

# 关闭预览
- tapOn: "Close preview"

# 校验点 2: 回到文件列表
- assertVisible: "Search files..."
