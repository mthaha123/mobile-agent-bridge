appId: com.mobileagentbridge
---
# Layer 2 — Settings 完整展示（VCS / Providers / Agents / Config）
- launchApp

- tapOn: "ws://192.168.1.100:8080/ws"
- eraseText: 50
- inputText: "ws://10.0.2.2:8081/ws"
- tapOn: "password (optional)"
- inputText: "test123"
- tapOn: "project directory (e.g. /home/user/project)"
- inputText: "."
- tapOn: "Connect"

- extendedWaitUntil:
    visible: "+ New"
    timeout: 20000

# 进入 Settings
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "Connected"
    timeout: 10000

# 连接信息
- assertVisible: "Bridge URL"

# 项目信息
- assertVisible: "/mock-project"

# VCS 信息
- assertVisible: "git"
- assertVisible: "main"

# Providers 列表
- assertVisible: "Anthropic"
- assertVisible: "OpenAI"

# 滚动到底部
- swipe:
    direction: UP
    duration: 500

# Agents 列表
- assertVisible: "Build Agent"
- assertVisible: "Debug Agent"
- assertVisible: "Architect Agent"

# 断开连接按钮
- assertVisible: "Disconnect"
