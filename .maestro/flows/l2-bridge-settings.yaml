appId: com.mobileagentbridge
---
# Layer 2 — Settings 完整展示（VCS / Providers / Agents / Config / Saved Permissions）
- launchApp

- tapOn: "ws://192.168.1.100:8080/ws"
- eraseText: 50
- inputText: "ws://10.0.2.2:8081/ws"
- tapOn: "password (optional)"
- inputText: "test123"
- tapOn: "project directory (e.g. /home/user/project)"
- inputText: "."
- tapOn: "Connect"

- extendedWaitUntil:
    visible: "+ New"
    timeout: 20000

# 进入 Settings
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "Connected"
    timeout: 10000

# 连接信息
- assertVisible: "Bridge URL"

# 项目信息
- assertVisible: "/mock-project"

# Config 区块（编辑 + key/value 展示）
- assertVisible: "Config"
- assertVisible: "Edit"
- assertVisible: "theme"
- assertVisible: "dark"
- assertVisible: "language"
- assertVisible: "zh"

# 点击 Edit 打开配置编辑器
- tapOn: "Edit"
- extendedWaitUntil:
    visible: "Edit Config"
    timeout: 5000
- tapOn: "Cancel"
- extendedWaitUntil:
    notVisible: "Edit Config"
    timeout: 5000

# 滚动到中间（VCS + Providers + Agents）
- swipe:
    direction: UP
    duration: 500
- swipe:
    direction: UP
    duration: 300

# VCS 信息
- assertVisible: "git"
- assertVisible: "main"

# Providers 列表
- assertVisible: "Anthropic"

# Agents 列表
- assertVisible: "Build Agent"
- assertVisible: "Debug Agent"
- assertVisible: "Architect Agent"

# 继续滚动到底部（Saved Permissions）
- swipe:
    direction: UP
    duration: 500

# Saved Permissions 区块（新功能）
- assertVisible: "SAVED PERMISSIONS (0)"

# 断开连接按钮
- assertVisible: "Disconnect"
