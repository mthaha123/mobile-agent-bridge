appId: com.mobileagentbridge
---
# Layer 3 — ToolApprovalSheet Always Allow 分支:
# 发送 magic message → 审批面板弹出 → 点击 Always Allow → 面板关闭
- launchApp

- tapOn: "ws://192.168.1.100:8080/ws"
- eraseText: 50
- inputText: "ws://10.0.2.2:8081/ws"
- tapOn: "password (optional)"
- inputText: "test123"
- tapOn: "project directory (e.g. /home/user/project)"
- inputText: "."
- tapOn: "Connect"

- extendedWaitUntil:
    visible: "+ New"
    timeout: 20000

- tapOn: "+ New"
- extendedWaitUntil:
    visible: "Open commands"
    timeout: 15000

- assertVisible: "Open commands"

# 发送 magic message 触发 permission.v2.asked 通知
- tapOn: "Type a message..."
- eraseText: 50
- inputText: "t"
- eraseText: 50
- inputText: '__push__:permission.v2.asked:{"id":"req-always-1"}'
- pressKey: Enter

# 校验审批面板弹出
- extendedWaitUntil:
    visible: "Always Allow"
    timeout: 10000
- assertVisible: "Reject"
- assertVisible: "Approve"

# 点击 Always Allow → 面板关闭
- tapOn: "Always Allow"

- extendedWaitUntil:
    notVisible: "Always Allow"
    timeout: 10000

# 验证仍在 ChatScreen
- assertVisible: "Open commands"
