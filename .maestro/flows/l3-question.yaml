appId: com.mobileagentbridge
---
# Layer 3 — QuestionSheet: 发送 magic message → 提问面板弹出 → 选择选项 → Submit
- launchApp

- tapOn: "ws://192.168.1.100:8080/ws"
- eraseText: 50
- inputText: "ws://10.0.2.2:8081/ws"
- tapOn: "password (optional)"
- inputText: "test123"
- tapOn: "project directory (e.g. /home/user/project)"
- inputText: "."
- tapOn: "Connect"

- extendedWaitUntil:
    visible: "+ New"
    timeout: 20000

- tapOn: "+ New"
- extendedWaitUntil:
    visible: "New Session"
    timeout: 15000

# 发送 magic message 触发 question.v2.asked push 通知
- tapOn: "Type a message..."
- inputText: '__push__:question.v2.asked:{"id":"q-1","sessionID":"mock_s1","questions":[{"question":"Allow this operation?","options":[{"label":"Yes"},{"label":"No"}],"multiple":false}]}'
- tapOn: "➤"

- extendedWaitUntil:
    visible: "Question"
    timeout: 10000
- assertVisible: "Allow this operation?"

- tapOn: ".*Yes"
- tapOn: "Submit"

- extendedWaitUntil:
    notVisible: "Question"
    timeout: 10000
