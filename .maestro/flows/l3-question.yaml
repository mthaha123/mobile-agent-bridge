appId: com.mobileagentbridge
---
# Layer 3 — QuestionSheet: 发送 magic message → 提问面板弹出 → 选择选项 → Submit
- launchApp

- tapOn: "ws://192.168.1.100:8080/ws"
- eraseText: 50
- inputText: "ws://10.0.2.2:8081/ws"
- tapOn: "password (optional)"
- inputText: "test123"
- tapOn: "project directory (e.g. /home/user/project)"
- inputText: "."
- tapOn: "Connect"

- extendedWaitUntil:
    visible: "+ New"
    timeout: 20000

- tapOn: "+ New"
- extendedWaitUntil:
    visible: "Open commands"
    timeout: 15000

# session.create 后 mock-bridge 自动发送 question.v2.asked 通知

- extendedWaitUntil:
    visible: "Submit"
    timeout: 10000
- assertVisible: "Reject"

- tapOn: ".*Yes"

- extendedWaitUntil:
    notVisible: "Reject"
    timeout: 10000
