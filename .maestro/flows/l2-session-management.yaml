appId: com.mobileagentbridge
---
# Layer 2 — Session Management: 创建 → 返回 → 详情 → 重命名
- launchApp

# 连接
- tapOn: "ws://192.168.1.100:8080/ws"
- eraseText: 50
- inputText: "ws://10.0.2.2:8081/ws"
- tapOn: "password (optional)"
- inputText: "test123"
- tapOn: "project directory (e.g. /home/user/project)"
- inputText: "."
- tapOn: "Connect"
- extendedWaitUntil:
    visible: "+ New"
    timeout: 20000

# 校验点 1: 会话列表加载
- assertVisible: "+ New"

# 创建 Session → ChatScreen
- tapOn: "+ New"
- extendedWaitUntil:
    visible: "< Sessions"
    timeout: 15000

# 校验点 2: ChatScreen 显示
- assertVisible: "< Sessions"

# 返回会话列表
- tapOn: "< Sessions"
- extendedWaitUntil:
    visible: "+ New"
    timeout: 10000

# 再创建 Session 进入 ChatScreen
- tapOn: "+ New"
- extendedWaitUntil:
    visible: "< Sessions"
    timeout: 15000

# 打开 Session 详情
- tapOn: "📋"
- extendedWaitUntil:
    visible: "Fork"
    timeout: 10000

# 校验点 3: SessionInfoModal 弹出
- assertVisible: "Fork"

# 重命名
- tapOn: "✏️"
- extendedWaitUntil:
    visible: "Session name"
    timeout: 5000
- eraseText: 50
- inputText: "Renamed Session"
- tapOn: "Save"
- assertNotVisible: "Session name"

# 点击 Fork → 弹出 "Forked" 确认 Alert
- tapOn: "Fork"
- extendedWaitUntil:
    visible: "Forked"
    timeout: 10000
- assertVisible: "OK"
- tapOn: "OK"

# Alert 关闭后 Modal 已关，返回 ChatScreen
- extendedWaitUntil:
    notVisible: "Forked"
    timeout: 10000
- assertVisible: "< Sessions"
