appId: com.mobileagentbridge
---
# Layer 2 — 模型选择器搜索功能验证（两行布局 + 名称/服务商过滤 + 清除按钮）
- launchApp

- tapOn: "ws://192.168.1.100:8080/ws"
- eraseText: 50
- inputText: "ws://10.0.2.2:8081/ws"
- tapOn: "password (optional)"
- inputText: "test123"
- tapOn: "project directory (e.g. /home/user/project)"
- inputText: "."
- tapOn: "Connect"

- extendedWaitUntil:
    visible: "+ New"
    timeout: 20000

- tapOn: "+ New"
- extendedWaitUntil:
    visible: "New Session"
    timeout: 15000

# 打开模型选择弹窗
- tapOn: "Model settings"
- extendedWaitUntil:
    visible: "Select Model"
    timeout: 5000

# 搜索框可见（accessibilityLabel；RN placeholder=hint 不参与 Maestro 文本匹配）
- assertVisible: "Search models"

# ── 按名称过滤（大小写不敏感）──
- tapOn: "Search models"
- inputText: "claude"
- assertVisible: "Claude Sonnet 4"
- assertNotVisible: "GPT-4o"
- assertNotVisible: "DeepSeek V3"

# ── ✕ 清除恢复全列表 ──
- tapOn: "✕"
- assertVisible: "GPT-4o"
- assertVisible: "DeepSeek V3"

# ── 按服务商名过滤 ──
- inputText: "openai"
- assertVisible: "GPT-4o"
- assertNotVisible: "Claude Sonnet 4"
- assertNotVisible: "DeepSeek V3"

# ── 清除后点选模型关闭弹窗 ──
- tapOn: "✕"
- assertVisible: "Claude Sonnet 4"
- tapOn: "Claude Sonnet 4"
- extendedWaitUntil:
    visible: "Model settings"
    timeout: 5000
